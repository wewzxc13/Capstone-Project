<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE Fix Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .message { margin: 5px 0; padding: 5px; background: white; border-left: 3px solid #007bff; }
        .duplicate { border-left-color: #dc3545; background: #fff5f5; }
        .controls { margin: 20px 0; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        .test-result { padding: 15px; margin: 10px 0; border-radius: 5px; font-weight: bold; }
        .test-passed { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .test-failed { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .test-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
    </style>
</head>
<body>
    <h1>SSE Infinite Loop Fix Test</h1>
    
    <div class="controls">
        <button onclick="startSSE()">Start SSE Connection</button>
        <button onclick="stopSSE()">Stop SSE Connection</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>
    
    <div id="status" class="status disconnected">Disconnected</div>
    
    <div id="testResult" class="test-result" style="display: none;">
        <h3>Test Result:</h3>
        <div id="testResultContent"></div>
    </div>
    
    <div class="log">
        <h3>SSE Messages Log:</h3>
        <div id="messages"></div>
    </div>
    
    <div class="log">
        <h3>Statistics:</h3>
        <div id="stats">
            <p>Total Messages: <span id="totalCount">0</span></p>
            <p>Unique Messages: <span id="uniqueCount">0</span></p>
            <p>Duplicate Messages: <span id="duplicateCount">0</span></p>
            <p>Connection Status: <span id="connectionStatus">Disconnected</span></p>
            <p>Last Check Time: <span id="lastCheckTime">-</span></p>
            <p>Test Duration: <span id="testDuration">0s</span></p>
        </div>
    </div>
    
    <div class="log">
        <h3>Debug Information:</h3>
        <div id="debug">
            <p>SSE URL: <span id="sseUrl">-</span></p>
            <p>Console Log: <button onclick="showConsoleLog()">View Console</button></p>
        </div>
    </div>

    <script>
        let eventSource = null;
        let messageCount = 0;
        let uniqueMessages = new Set();
        let duplicateMessages = 0;
        let messageLog = [];
        let testStartTime = null;
        let lastCheckTime = null;

        function startSSE() {
            if (eventSource) {
                eventSource.close();
            }
            
            // Use a timestamp from 1 hour ago to get recent messages
            lastCheckTime = new Date(Date.now() - 60 * 60 * 1000).toISOString();
            const sseUrl = `http://localhost/capstone-project/backend/Communication/sse_messages.php?user_id=1&last_check=${lastCheckTime}`;
            
            console.log('Starting SSE connection:', sseUrl);
            document.getElementById('sseUrl').textContent = sseUrl;
            document.getElementById('lastCheckTime').textContent = lastCheckTime;
            testStartTime = Date.now();
            
            eventSource = new EventSource(sseUrl);
            
            eventSource.onopen = () => {
                console.log('SSE connection opened');
                document.getElementById('status').textContent = 'Connected';
                document.getElementById('status').className = 'status connected';
                document.getElementById('connectionStatus').textContent = 'Connected';
            };
            
            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    console.log('SSE message received:', data);
                    
                    messageCount++;
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'message';
                    
                    if (data.type === 'individual_message' || data.type === 'group_message') {
                        const messageId = data.message_id || data.group_message_id;
                        const messageKey = `${data.type}_${messageId}`;
                        
                        if (uniqueMessages.has(messageKey)) {
                            duplicateMessages++;
                            messageDiv.className += ' duplicate';
                            messageDiv.innerHTML = `<strong>DUPLICATE:</strong> ${data.type} - ID: ${messageId} - "${data.message_text}"`;
                        } else {
                            uniqueMessages.add(messageKey);
                            messageDiv.innerHTML = `${data.type} - ID: ${messageId} - "${data.message_text}"`;
                        }
                    } else {
                        messageDiv.innerHTML = `${data.type}: ${JSON.stringify(data)}`;
                    }
                    
                    document.getElementById('messages').appendChild(messageDiv);
                    updateStats();
                    
                    // Keep only last 50 messages visible
                    const messages = document.getElementById('messages');
                    while (messages.children.length > 50) {
                        messages.removeChild(messages.firstChild);
                    }
                    
                } catch (error) {
                    console.error('Error parsing SSE message:', error);
                }
            };
            
            eventSource.onerror = (error) => {
                console.error('SSE error:', error);
                document.getElementById('status').textContent = 'Error - Check Console';
                document.getElementById('status').className = 'status disconnected';
                document.getElementById('connectionStatus').textContent = 'Error';
            };
        }
        
        function stopSSE() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
                document.getElementById('status').textContent = 'Disconnected';
                document.getElementById('status').className = 'status disconnected';
                document.getElementById('connectionStatus').textContent = 'Disconnected';
            }
        }
        
        function clearLogs() {
            document.getElementById('messages').innerHTML = '';
            messageCount = 0;
            uniqueMessages.clear();
            duplicateMessages = 0;
            updateStats();
        }
        
        function updateStats() {
            document.getElementById('totalCount').textContent = messageCount;
            document.getElementById('uniqueCount').textContent = uniqueMessages.size;
            document.getElementById('duplicateCount').textContent = duplicateMessages;
            
            if (testStartTime) {
                const duration = Math.floor((Date.now() - testStartTime) / 1000);
                document.getElementById('testDuration').textContent = duration + 's';
                
                // Auto-test after 30 seconds
                if (duration === 30) {
                    runAutoTest();
                }
            }
        }
        
        function runAutoTest() {
            const testResultDiv = document.getElementById('testResult');
            const testResultContent = document.getElementById('testResultContent');
            
            testResultDiv.style.display = 'block';
            
            if (duplicateMessages === 0 && messageCount > 0) {
                testResultDiv.className = 'test-result test-passed';
                testResultContent.innerHTML = `
                    ✅ <strong>TEST PASSED!</strong><br>
                    No duplicate messages detected. The infinite loop fix is working correctly.<br>
                    Total Messages: ${messageCount} | Unique Messages: ${uniqueMessages.size} | Duplicates: ${duplicateMessages}
                `;
            } else if (duplicateMessages > 0) {
                testResultDiv.className = 'test-result test-failed';
                testResultContent.innerHTML = `
                    ❌ <strong>TEST FAILED!</strong><br>
                    Duplicate messages detected. The infinite loop issue still exists.<br>
                    Total Messages: ${messageCount} | Unique Messages: ${uniqueMessages.size} | Duplicates: ${duplicateMessages}
                `;
            } else {
                testResultDiv.className = 'test-result test-warning';
                testResultContent.innerHTML = `
                    ⚠️ <strong>TEST INCONCLUSIVE</strong><br>
                    No messages received yet. Please wait for messages or check your connection.<br>
                    Total Messages: ${messageCount} | Unique Messages: ${uniqueMessages.size} | Duplicates: ${duplicateMessages}
                `;
            }
        }
        
        function showConsoleLog() {
            console.log('=== SSE Test Console Log ===');
            console.log('Total Messages:', messageCount);
            console.log('Unique Messages:', uniqueMessages.size);
            console.log('Duplicate Messages:', duplicateMessages);
            console.log('Last Check Time:', lastCheckTime);
            console.log('Test Duration:', testStartTime ? Math.floor((Date.now() - testStartTime) / 1000) + 's' : 'N/A');
            console.log('Unique Message IDs:', Array.from(uniqueMessages));
        }
        
        // Auto-start on page load
        window.onload = () => {
            startSSE();
        };
    </script>
</body>
</html>
